name: Install Node-RED Nodes and Zip

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Create temp directory
      run: mkdir -p temp-nodes
      
    - name: Install & Zip node-red-dashboard
      run: |
        cd temp-nodes
        npm init -y
        npm install node-red-dashboard --save --production
        zip -r ../nodes/node-red-dashboard.zip node_modules/node-red-dashboard package.json package-lock.json
        cd ..
        mkdir -p nodes
        
    - name: Install & Zip node-red-node-ui-webcam
      run: |
        cd temp-nodes
        npm install node-red-node-ui-webcam --save --production
        zip -r ../nodes/node-red-node-ui-webcam.zip node_modules/node-red-node-ui-webcam
        cd ..
        
    - name: Install & Zip node-red-contrib-puppeteer
      run: |
        cd temp-nodes
        npm install node-red-contrib-puppeteer --save --production
        zip -r ../nodes/node-red-contrib-puppeteer.zip node_modules/node-red-contrib-puppeteer
        cd ..
        
    - name: Install & Zip node-red-contrib-playwright
      run: |
        cd temp-nodes
        npm install node-red-contrib-playwright --save --production
        zip -r ../nodes/node-red-contrib-playwright.zip node_modules/node-red-contrib-playwright
        cd ..
        
    - name: Install & Zip node-red-node-email
      run: |
        cd temp-nodes
        npm install node-red-node-email --save --production
        zip -r ../nodes/node-red-node-email.zip node_modules/node-red-node-email
        cd ..
        
    - name: Cleanup & Commit
      run: |
        rm -rf temp-nodes
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add nodes/ || true
        git commit -m "Add Node-RED nodes zips" || echo "No changes"
        git push || echo "Push skipped"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: node-red-nodes
        path: nodes/
