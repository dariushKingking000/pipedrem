name: Screenshot Bot
on: 
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create .gitignore
      run: |
        cat > .gitignore << EOF
        node_modules/
        bot.js
        package.json
        package-lock.json
        command.txt
        last_command.txt
        command_pipe.txt
        response.txt
        frames/
        /tmp/
        EOF
    
    - name: Install Chrome + FFmpeg
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq wget gnupg xvfb x11-xkb-utils ffmpeg bc \
          libnss3 libatk1.0-0 libdrm2 libxkbcommon0 libatspi2.0-0 \
          libxcomposite1 libxdamage1 libxrandr2 libgbm1 libgtk-3-0
        
        # Chrome GPG fix
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | \
          sudo gpg --dearmor --yes -o /usr/share/keyrings/google-chrome.gpg
        
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | \
          sudo tee /etc/apt/sources.list.d/google-chrome.list
        
        sudo apt-get update -qq
        sudo apt-get install -y -qq google-chrome-stable
    
    - name: Install Node
      run: npm init -y && npm i puppeteer@latest
    
    - name: Setup Bot (TargetClosed FIX)
      run: |
        cat > bot.js << 'EOF'
        const puppeteer = require("puppeteer");
        const fs = require("fs");
        const { execSync } = require("child_process");
        
        let browser = null;
        let page = null;
        let retries = 0;
        
        function wait(ms) {
          return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        async function safeLaunch() {
          try {
            console.log("🚀 Launch (attempt " + (retries + 1) + ")");
            
            browser = await puppeteer.launch({
              headless: false,
              executablePath: '/usr/bin/google-chrome-stable',
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-accelerated-2d-canvas',
                '--no-first-run',
                '--no-zygote',
                '--single-process',
                '--disable-gpu',
                '--disable-background-timer-throttling',
                '--disable-backgrounding-occluded-windows',
                '--disable-renderer-backgrounding',
                '--disable-extensions',
                '--disable-default-apps',
                '--disable-plugins',
                '--disable-hang-monitor',
                '--disable-prompt-on-repost',
                '--disable-client-side-phishing-detection',
                '--disable-sync',
                '--metrics-recording-only',
                '--no-default-browser-check',
                '--disable-popup-blocking',
                '--window-size=1920,1080',
                '--disable-web-security',
                '--remote-debugging-port=9222'
              ],
              timeout: 60000
            });
            
            page = await browser.newPage();
            await page.setViewport({ width: 1920, height: 1080 });
            
            // Stealth
            await page.evaluateOnNewDocument(() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
              Object.defineProperty(navigator, 'plugins', { get: () => [1, 2, 3, 4, 5] });
              window.chrome = { runtime: {} };
            });
            
            console.log("✅ Browser OK!");
            retries = 0;
            return true;
            
          } catch (e) {
            console.error("❌ Launch failed:", e.message);
            retries++;
            if (retries < 3) {
              await wait(5000);
              return await safeLaunch();
            }
            throw e;
          }
        }
        
        async function initBrowser() {
          await safeLaunch();
          
          // Pipedream + human movement
          try {
            await page.goto("https://pipedream.com/auth/signup", { 
              waitUntil: 'networkidle0', 
              timeout: 60000 
            });
            await wait(8000);
            await page.mouse.move(100, 100);
            console.log("✅ Pipedream loaded!");
          } catch (e) {
            console.log("⚠️ Pipedream fallback to Google");
            await page.goto("https://google.com", { waitUntil: 'domcontentloaded' });
          }
        }
        
        async function reconnect() {
          try {
            if (!browser || browser.isConnected() === false) throw new Error("Browser dead");
            await page.bringToFront();
            await page.evaluate(() => document.readyState === 'complete');
            return true;
          } catch (e) {
            console.log("🔄 Full reconnect...");
            if (page) await page.close().catch(() => {});
            await safeLaunch();
            
            // Reload page
            await page.goto("https://pipedream.com/auth/signup", { 
              waitUntil: 'networkidle0', 
              timeout: 30000 
            });
            await wait(3000);
            return true;
          }
        }
        
        async function takeScreenshot() {
          console.log("📸 Screenshot...");
          await reconnect();
          await wait(1500);
          
          await page.screenshot({ path: 'screenshot.png' });
          await page.screenshot({ path: 'screenshot-full.png', fullPage: true });
          
          const buffer = await page.screenshot({ type: 'png', fullPage: true });
          fs.writeFileSync("screenshot-base64.txt", buffer.toString('base64'));
        }
        
        async function executeCommand(cmd) {
          console.log(`🔧 ${cmd}`);
          await reconnect();
          
          if (cmd.startsWith("click ")) {
            const [x, y] = cmd.slice(6).trim().split(",").map(Number);
            await page.mouse.move(x + Math.random()*10-5, y + Math.random()*10-5);
            await wait(100);
            await page.mouse.click(x, y);
          } else if (cmd.startsWith("type ")) {
            await page.keyboard.type(cmd.slice(5).trim(), { delay: 80 });
          } else if (cmd === "enter") {
            await page.keyboard.press('Enter');
          } else if (cmd.startsWith("goto ")) {
            await page.goto(cmd.slice(5).trim(), { waitUntil: 'networkidle0' });
          }
        }
        
        async function recordVideo(commands) {
          console.log("🎥 Recording...");
          
          if (fs.existsSync('frames')) fs.rmSync('frames', { recursive: true });
          fs.mkdirSync('frames');
          
          let frame = 0;
          for(let cmd of commands) {
            // 3 pre-frames
            for(let i = 0; i < 3; i++) {
              await reconnect();
              await page.screenshot({ path: `frames/f${frame.toString().padStart(5,'0')}.png` });
              frame++;
              await wait(400);
            }
            
            await executeCommand(cmd);
            
            // 5 post-frames
            for(let i = 0; i < 5; i++) {
              await reconnect();
              await page.screenshot({ path: `frames/f${frame.toString().padStart(5,'0')}.png` });
              frame++;
              await wait(400);
            }
          }
          
          await takeScreenshot();
          
          const video = `video_${Date.now()}.mp4`;
          execSync(`ffmpeg -y -r 10 -i frames/f%05d.png -c:v libx264 -crf 23 -pix_fmt yuv420p ${video}`);
          
          fs.rmSync('frames', { recursive: true });
          console.log(`✅ ${frame} frames -> ${video}`);
        }
        
        (async () => {
          try {
            await initBrowser();
            
            while(true) {
              if (fs.existsSync('command_pipe.txt')) {
                let cmd = fs.readFileSync('command_pipe.txt', 'utf8').trim();
                console.log(`🆕 ${cmd}`);
                
                if (cmd === "exit") process.exit(0);
                
                let commands = cmd.split('\n').map(l=>l.trim()).filter(l=>l);
                await recordVideo(commands);
                fs.writeFileSync('response.txt', `✅ ${commands.length} cmds | ${commands.length * 8}s`);
                fs.unlinkSync('command_pipe.txt');
              }
              await wait(1000);
            }
          } catch(e) {
            console.error("FATAL:", e);
            process.exit(1);
          }
        })();
        EOF
    
    - name: Bot LOOP
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Xvfb stable
        export DISPLAY=:99
        sudo Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
        
        git config --global user.name "Screenshot Bot"
        git config --global user.email "bot@github.com"
        
        rm -rf *txt *png *mp4 frames/ 2>/dev/null
        
        timeout 7200 node bot.js &
        PID=$!
        echo "🤖 PID: $PID"
        sleep 60  # بیشتر صبر کن
        
        while true; do
          git fetch origin
          git reset --hard origin/main
          
          if [ -f command.txt ]; then
            CONTENT=$(cat command.txt)
            LAST=$(cat last_command.txt 2>/dev/null || echo "")
            
            if [ "$CONTENT" != "$LAST" ] && [ "$CONTENT" != "exit" ]; then
              echo "🆕 '$CONTENT'"
              rm -rf *png *mp4 *txt frames/ 2>/dev/null
              echo "$CONTENT" > command_pipe.txt
              
              for i in {1..180}; do  # 6 دقیقه
                if [ -f response.txt ]; then
                  echo "$(cat response.txt)"
                  rm -f response.txt command_pipe.txt
                  break
                fi
                sleep 2
              done
              
              # Files
              for f in screenshot.png screenshot-full.png screenshot-base64.txt video_*.mp4; do
                [ -f "$f" ] && echo "📁 $f ($(ls -lh $f | awk '{print $5}'))"
              done
              
              git add -f screenshot*.png screenshot-base64.txt video*.mp4 .gitignore bot.js 2>/dev/null || true
              
              if ! git diff --staged --quiet; then
                git commit -m "🎥 Stealth Bot | $(date +'%H:%M') | $CONTENT" || true
                git push origin main -f || true
                echo "✅ Git OK!"
              fi
              
              echo "$CONTENT" > last_command.txt
            fi
            rm -f command.txt
          fi
          
          sleep 10
        done
