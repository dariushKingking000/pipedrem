name: Screenshot Bot
on: 
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create .gitignore FIRST
      run: |
        cat > .gitignore << EOF
        node_modules/
        bot.js
        package.json
        package-lock.json
        command.txt
        last_command.txt
        command_pipe.txt
        response.txt
        frames/
        /tmp/
        chrome-user-data-*
        EOF
    
    - name: Install Chrome + FFmpeg (FIXED)
      run: |
        # Update & install basics
        sudo apt-get update -qq
        
        # Chrome dependencies
        sudo apt-get install -y -qq wget gnupg xvfb x11-xkb-utils ffmpeg bc libxss1 libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libatspi2.0-0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo-gobject2 libgtk-3-0 libasound2
        
        # Chrome GPG key (NO TTY - batch mode)
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor --yes -o /usr/share/keyrings/google-chrome.gpg
        
        # Chrome repo
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        
        # Update & install Chrome
        sudo apt-get update -qq
        sudo apt-get install -y -qq google-chrome-stable
        
        echo "✅ Chrome + FFmpeg installed!"
    
    - name: Install Node deps
      run: npm init -y && npm i puppeteer@latest
    
    - name: Setup Bot
      run: |
        cat > bot.js << 'EOF'
        const puppeteer = require("puppeteer");
        const fs = require("fs").promises;
        const fsSync = require("fs");
        const { execSync } = require("child_process");
        const path = require("path");
        
        let browser = null;
        let page = null;
        
        function wait(ms) {
          return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        async function initBrowser() {
          console.log("🚀 راه‌اندازی مرورگر...");
          
          const userDataDir = `/tmp/chrome-user-data-${Date.now()}`;
          
          try {
            browser = await puppeteer.launch({
              headless: false,
              executablePath: '/usr/bin/google-chrome-stable',
              userDataDir: userDataDir,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--no-first-run',
                '--no-zygote',
                '--single-process',
                '--no-service-autorun',
                '--disable-background-timer-throttling',
                '--disable-backgrounding-occluded-windows',
                '--disable-renderer-backgrounding',
                '--disable-extensions',
                '--disable-plugins',
                '--disable-web-security',
                '--disable-features=VizDisplayCompositor',
                '--window-size=1920,1080',
                '--disable-gpu-sandbox',
                '--enable-logging',
                '--v=1',
                '--disable-gpu'
              ]
            });
            
            page = await browser.newPage();
            await page.setViewport({ width: 1920, height: 1080 });
            
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');
            
            // Test page
            await page.goto("https://www.google.com", { 
              waitUntil: 'domcontentloaded', 
              timeout: 60000 
            });
            
            await wait(3000);
            console.log("✅ مرورگر آماده!");
            return userDataDir;
            
          } catch(e) {
            console.error("❌ Browser init error:", e.message);
            throw e;
          }
        }
        
        async function reconnectBrowser() {
          try {
            if (!browser || browser.isConnected() === false) {
              throw new Error("Browser disconnected");
            }
            
            await page.bringToFront();
            const result = await page.evaluate(() => {
              return {
                ready: document.readyState === 'complete',
                body: document.body ? document.body.innerHTML.length > 0 : false
              };
            });
            
            if (!result.body) {
              throw new Error("Empty page");
            }
            
            console.log("✅ Page healthy");
            return true;
            
          } catch(e) {
            console.log("🔄 Reconnect browser...");
            
            if (page) await page.close().catch(() => {});
            if (browser) await browser.close().catch(() => {});
            
            await initBrowser();
            return true;
          }
        }
        
        async function takeScreenshot() {
          console.log("📸 اسکرین‌شات...");
          await reconnectBrowser();
          await wait(2000);
          
          try {
            await page.screenshot({ path: 'screenshot.png', type: 'png' });
            await page.screenshot({ path: 'screenshot-full.png', fullPage: true, type: 'png' });
            
            const buffer = await page.screenshot({ type: 'png', fullPage: true });
            fsSync.writeFileSync("screenshot-base64.txt", buffer.toString('base64'));
            
            console.log("✅ اسکرین‌شات OK");
          } catch(e) {
            console.error("❌ Screenshot error:", e.message);
          }
        }
        
        async function executeCommand(cmd) {
          console.log(`🔧 ${cmd}`);
          await reconnectBrowser();
          await wait(1000);
          
          try {
            if (cmd.startsWith("goto ")) {
              const url = cmd.slice(5).trim();
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await wait(3000);
              
            } else if (cmd.startsWith("click ")) {
              const [x, y] = cmd.slice(6).trim().split(",").map(Number);
              await page.mouse.click(x, y);
              
            } else if (cmd.startsWith("type ")) {
              const text = cmd.slice(5).trim();
              await page.keyboard.type(text);
              
            } else if (cmd === "enter") {
              await page.keyboard.press('Enter');
              
            } else if (cmd === "copy") {
              const text = await page.evaluate(() => document.body.innerText.slice(0, 50000));
              fsSync.writeFileSync('page-text.txt', text);
              
            } else if (cmd.startsWith("scroll ")) {
              const y = parseInt(cmd.slice(7));
              await page.evaluate(y => window.scrollBy(0, y), y);
            }
          } catch(e) {
            console.log("❌ Command error:", e.message);
          }
        }
        
        async function recordVideo(commands) {
          console.log("🎥 ویدیو...");
          const uniqueId = Date.now();
          
          await reconnectBrowser();
          
          const framesDir = 'frames';
          if (fsSync.existsSync(framesDir)) {
            fsSync.rmSync(framesDir, { recursive: true, force: true });
          }
          fsSync.mkdirSync(framesDir, { recursive: true });
          
          let frame = 0;
          
          for(let cmd of commands) {
            // Pre frames
            for(let i = 0; i < 2; i++) {
              await page.screenshot({ path: `${framesDir}/f${frame.toString().padStart(5,'0')}.png` });
              frame++;
              await wait(500);
            }
            
            await executeCommand(cmd);
            await wait(1500);
            
            // Post frames
            for(let i = 0; i < 5; i++) {
              await page.screenshot({ path: `${framesDir}/f${frame.toString().padStart(5,'0')}.png` });
              frame++;
              await wait(500);
            }
          }
          
          await takeScreenshot();
          
          const video = `video_${uniqueId}.mp4`;
          try {
            execSync(`ffmpeg -y -r 8 -i ${framesDir}/f%05d.png -c:v libx264 -crf 25 -pix_fmt yuv420p -vf "scale=1280:720" ${video}`, { timeout: 30000 });
            console.log(`✅ Video: ${video}`);
          } catch(e) {
            console.error("❌ FFmpeg error");
          }
          
          fsSync.rmSync(framesDir, { recursive: true, force: true });
        }
        
        (async () => {
          try {
            await initBrowser();
            
            while(true) {
              if (fsSync.existsSync('command_pipe.txt')) {
                const cmd = fsSync.readFileSync('command_pipe.txt', 'utf8').trim();
                console.log(`🆕 ${cmd}`);
                
                if (cmd === "exit") process.exit(0);
                
                const commands = cmd.split('\n').map(l => l.trim()).filter(Boolean);
                if (commands.length) {
                  await recordVideo(commands);
                  fsSync.writeFileSync('response.txt', `✅ ${commands.length} OK`);
                }
                
                fsSync.unlinkSync('command_pipe.txt');
              }
              await wait(1000);
            }
          } catch(e) {
            console.error("❌ Fatal:", e);
            process.exit(1);
          }
        })();
        EOF
    
    - name: Start Bot LOOP
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Xvfb
        export DISPLAY=:99
        Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
        
        git config --global user.name "Screenshot Bot"
        git config --global user.email "bot@github.com"
        
        rm -rf *txt *png *mp4 frames tmp chrome-user-data-* 2>/dev/null || true
        
        timeout 7200 node bot.js &
        PID=$!
        echo "🤖 PID: $PID"
        sleep 60
        
        while true; do
          git fetch origin
          git reset --hard origin/main
          
          if [ -f command.txt ]; then
            CONTENT=$(cat command.txt 2>/dev/null || echo "")
            LAST=$(cat last_command.txt 2>/dev/null || echo "")
            
            if [ "$CONTENT" != "$LAST" ] && [ -n "$CONTENT" ] && [ "$CONTENT" != "exit" ]; then
              echo "🆕 $CONTENT"
              rm -rf *png *mp4 *txt frames/ 2>/dev/null || true
              echo "$CONTENT" > command_pipe.txt
              
              for i in {1..180}; do
                if [ -f response.txt ]; then
                  echo "$(cat response.txt)"
                  rm -f response.txt command_pipe.txt
                  break
                fi
                sleep 2
              done
              
              # Files
              FILES=""
              for f in screenshot.png screenshot-full.png screenshot-base64.txt video_*.mp4 page-text.txt; do
                [ -f "$f" ] && FILES="$FILES $f"
              done
              
              if [ -n "$FILES" ]; then
                git add -f $FILES .gitignore bot.js
                if ! git diff --staged --quiet; then
                  git commit -m "🎥 $(date +'%H:%M') | $CONTENT" || true
                  git push origin main -f || true
                  echo "✅ Push OK!"
                fi
              fi
              
              echo "$CONTENT" > last_command.txt
            fi
            rm -f command.txt
          fi
          
          sleep 10
        done
