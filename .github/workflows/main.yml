name: Node-RED Nodes ✅ PERFECT

on: 
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install
      run: |
        mkdir -p nodes
        cd nodes
        npm init -y -s
        npm install \
          node-red-dashboard \
          node-red-node-ui-webcam \
          node-red-contrib-puppeteer \
          node-red-contrib-playwright \
          node-red-node-email
        
    - name: Zip each node
      run: |
        cd nodes/node_modules
        for node in node-red-dashboard node-red-node-ui-webcam node-red-contrib-puppeteer node-red-contrib-playwright node-red-node-email; do
          if [ -d "$node" ]; then
            echo "📦 Creating $node.zip"
            mkdir -p "../../${node}"
            rsync -a "$node/" "../../${node}/"
            cd ../..
            zip -r "${node}.zip" "$node" -x "*/node_modules/*" "*/test*" "*/tests*" "*/.git*" >/dev/null
            rm -rf "$node"
            echo "✅ $(du -h "${node}.zip" | cut -f1)"
          fi
        done
        
    - name: Commit
      run: |
        git config --local user.name "GitHub Action"
        git config --local user.email "action@github.com"
        git add *.zip
        git commit -m "Node-RED nodes ✅ $(date)" || echo "No changes"
        git push
        
    - uses: actions/upload-artifact@v4
      with:
        name: NodeRED-Nodes
        path: '*.zip'
