name: Node-RED Nodes ✅ CUSTOM

on: 
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Specific Nodes
      run: |
        mkdir -p nodes
        cd nodes
        npm init -y -s
        npm install \
          node-red-dashboard@3.6.6 \
          node-red-node-ui-webcam \
          node-red-contrib-puppeteer \
          node-red-contrib-playwright

    - name: Zip Each Node ✅
      run: |
        cd nodes/node_modules
        declare -a nodes=(
          "node-red-dashboard"
          "node-red-node-ui-webcam" 
          "node-red-contrib-puppeteer"
          "node-red-contrib-playwright"
        )
        for node in "${nodes[@]}"; do
          if [ -d "$node" ]; then
            echo "📦 Creating $node.zip"
            rsync -a "$node/" "../../$node/"
            cd ../..
            zip -r "$node.zip" "$node" -x "*/node_modules/*" "*/test*" "*/tests*" "*/.git*" "*/examples*" >/dev/null 2>&1
            rm -rf "$node"
            echo "✅ $(du -h "$node.zip" | cut -f1)"
          else
            echo "❌ $node not found - skipping"
          fi
        done
        
    - name: Commit All Zips
      run: |
        git config --local user.name "GitHub Action"
        git config --local user.email "action@github.com"
        git add *.zip
        git commit -m "Node-RED nodes ✅ $(date) | $(ls -la *.zip | wc -l) files" || echo "No changes"
        git push
