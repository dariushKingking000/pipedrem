name: Screenshot Bot
on: 
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create .gitignore
      run: |
        cat > .gitignore << EOF
        node_modules/
        bot.js
        package.json
        package-lock.json
        command.txt
        last_command.txt
        command_pipe.txt
        response.txt
        frames/
        /tmp/
        chrome-user-data-*
        EOF
    
    - name: Install Chrome + FFmpeg (PERFECT)
      run: |
        sudo apt-get update -qq
        
        # MINIMAL deps - فقط ضروری‌ها
        sudo apt-get install -y -qq \
          wget gnupg xvfb ffmpeg bc \
          libnss3 libatk1.0-0 libatk-bridge2.0-0 \
          libdrm2 libxkbcommon0 libatspi2.0-0 \
          libxcomposite1 libxdamage1 libxrandr2 \
          libgbm1 libpango-1.0-0 libcairo2 \
          libgtk-3-0 libgdk-pixbuf2.0-0
        
        # Chrome GPG
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | \
          sudo gpg --dearmor --yes -o /usr/share/keyrings/google-chrome.gpg
        
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | \
          sudo tee /etc/apt/sources.list.d/google-chrome.list
        
        sudo apt-get update -qq
        sudo apt-get install -y -qq google-chrome-stable
        
        google-chrome --version
        echo "✅ INSTALLED!"
    
    - name: Install Node
      run: npm init -y && npm i puppeteer@latest
    
    - name: Setup Bot
      run: |
        cat > bot.js << 'EOF'
        const puppeteer = require("puppeteer");
        const fs = require("fs");
        const { execSync } = require("child_process");
        
        let browser = null;
        let page = null;
        
        function wait(ms) {
          return new Promise(r => setTimeout(r, ms));
        }
        
        async function init() {
          console.log("🚀 Starting...");
          browser = await puppeteer.launch({
            headless: false,
            executablePath: '/usr/bin/google-chrome-stable',
            args: [
              '--no-sandbox','--disable-setuid-sandbox',
              '--disable-dev-shm-usage','--no-first-run',
              '--disable-gpu','--no-zygote',
              '--window-size=1920,1080',
              '--disable-web-security','--disable-extensions'
            ]
          });
          
          page = await browser.newPage();
          await page.setViewport({width:1920,height:1080});
          await page.goto("https://google.com",{waitUntil:'domcontentloaded'});
          console.log("✅ Ready!");
        }
        
        async function reconnect() {
          try{
            await page.bringToFront();
            return true;
          }catch(e){
            console.log("🔄 Reconnect...");
            if(page) await page.close().catch(()=>{});  
            if(browser) await browser.close().catch(()=>{});  
            await init();
            return true;
          }
        }
        
        async function screenshot(){
          await reconnect();
          await wait(1000);
          await page.screenshot({path:'screenshot.png'});
          await page.screenshot({path:'screenshot-full.png',fullPage:true});
          const buf = await page.screenshot({type:'png',fullPage:true});
          fs.writeFileSync('screenshot-base64.txt',buf.toString('base64'));
        }
        
        async function cmd(c){
          await reconnect();
          if(c.startsWith("goto ")) await page.goto(c.slice(5),{waitUntil:'domcontentloaded'});
          else if(c.startsWith("click ")) {
            let [x,y]=c.slice(6).split(",").map(Number);
            await page.mouse.click(x,y);
          }
          else if(c.startsWith("type ")) await page.keyboard.type(c.slice(5));
          else if(c==="enter") await page.keyboard.press("Enter");
          else if(c==="copy"){
            let text=await page.evaluate(()=>document.body.innerText.slice(0,50000));
            fs.writeFileSync('page-text.txt',text);
          }
        }
        
        async function video(commands){
          if(fs.existsSync('frames')) fs.rmSync('frames',{recursive:true});
          fs.mkdirSync('frames');
          
          let f=0;
          for(let c of commands){
            for(let i=0;i<2;i++){
              await reconnect();
              await page.screenshot({path:`frames/f${f.toString().padStart(5,'0')}.png`});
              f++; await wait(400);
            }
            await cmd(c);
            for(let i=0;i<4;i++){
              await reconnect();
              await page.screenshot({path:`frames/f${f.toString().padStart(5,'0')}.png`});
              f++; await wait(400);
            }
          }
          
          await screenshot();
          
          let v=`video_${Date.now()}.mp4`;
          execSync(`ffmpeg -y -r 8 -i frames/f%05d.png -c:v libx264 -crf 25 -pix_fmt yuv420p -vf "scale=1280:720" ${v}`);
          fs.rmSync('frames',{recursive:true});
        }
        
        (async()=>{
          await init();
          while(1){
            if(fs.existsSync('command_pipe.txt')){
              let c=fs.readFileSync('command_pipe.txt','utf8').trim();
              console.log(`🆕 ${c}`);
              if(c==="exit") process.exit(0);
              
              let cmds=c.split('\n').map(l=>l.trim()).filter(l=>l);
              await video(cmds);
              fs.writeFileSync('response.txt',`✅ ${cmds.length}`);
              fs.unlinkSync('command_pipe.txt');
            }
            await wait(1000);
          }
        })();
        EOF
    
    - name: Bot Main Loop
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1920x1080x24 &
        
        git config --global user.name "Screenshot Bot"
        git config --global user.email "bot@github.com"
        
        rm -rf *txt *png *mp4 frames/ 2>/dev/null
        
        timeout 7200 node bot.js &
        PID=$!
        echo "🤖 $PID"
        sleep 30
        
        while true; do
          git fetch origin
          git reset --hard origin/main
          
          if [ -f command.txt ]; then
            CONTENT=$(cat command.txt)
            LAST=$(cat last_command.txt 2>/dev/null || echo "")
            
            if [ "$CONTENT" != "$LAST" ] && [ "$CONTENT" != "exit" ]; then
              echo "🆕 $CONTENT"
              rm -rf *png *mp4 *txt frames/ 2>/dev/null
              echo "$CONTENT" > command_pipe.txt
              
              for i in {1..120}; do
                if [ -f response.txt ]; then
                  cat response.txt
                  rm -f response.txt command_pipe.txt
                  break
                fi
                sleep 2
              done
              
              FILES=""
              for f in screenshot.png screenshot-full.png screenshot-base64.txt video_*.mp4 page-text.txt; do
                [ -f "$f" ] && FILES="$FILES $f"
              done
              
              if [ -n "$FILES" ]; then
                git add -f $FILES .gitignore bot.js
                if ! git diff --staged --quiet; then
                  git commit -m "🎥 $(date +'%H:%M') | $CONTENT"
                  git push origin main -f
                  echo "✅ PUSHED!"
                fi
              fi
              
              echo "$CONTENT" > last_command.txt
            fi
            rm -f command.txt
          fi
          
          sleep 10
        done
