name: Flask API Status Check

on:
  schedule:
    # هر 15 دقیقه یک بار اجرا شود
    - cron: '*/15 * * * *'
  workflow_dispatch: # امکان اجرای دستی

jobs:
  check_api_status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install requests library
        run: pip install requests

      - name: Check Flask API Status
        env:
          # آدرس API را به عنوان یک متغیر محیطی تعریف کنید
          # این آدرس باید آدرس واقعی Flask شما باشد که از خارج قابل دسترسی است
          FLASK_API_URL: http://your-flask-app.com:5000/status # <<<--- این آدرس را جایگزین کنید
        run: |
          echo '''
          import requests
          import os

          api_url = os.environ.get("FLASK_API_URL") # خواندن آدرس از متغیر محیطی

          if not api_url:
              print("Error: FLASK_API_URL environment variable not set.")
              exit(1)

          try:
              response = requests.get(api_url, timeout=10) # اضافه کردن timeout
              response.raise_for_status()

              print("GitHub Actions Simulation:")
              print(f"API Status Check: SUCCESS")
              print(f"Response from API: {response.json()}")

          except requests.exceptions.ConnectionError:
              print("GitHub Actions Simulation:")
              print(f"API Status Check: FAILED")
              print(f"Error: Could not connect to {api_url}. Is the Flask app running and accessible?")

          except requests.exceptions.HTTPError as e:
              print("GitHub Actions Simulation:")
              print(f"API Status Check: FAILED")
              print(f"HTTP Error: {e}")

          except requests.exceptions.Timeout:
              print("GitHub Actions Simulation:")
              print(f"API Status Check: FAILED")
              print(f"Error: Request to {api_url} timed out.")

          except Exception as e:
              print("GitHub Actions Simulation:")
              print(f"API Status Check: FAILED")
              print(f"An unexpected error occurred: {e}")
          ''' > check_api.py
          python check_api.py

