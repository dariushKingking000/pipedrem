name: Node-RED Nodes ✅ FIXED

on: 
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install & Prepare Nodes
      run: |
        mkdir -p nodes
        cd nodes
        npm init -y -s
        
        # Core dashboard ✅
        npm install node-red-dashboard@3.6.6
        
        # Webcam ✅
        npm install node-red-node-ui-webcam@1.3.3
        
        # Browser automation (manual prep)
        npm install puppeteer@latest playwright@latest
        
        # Create puppeteer/playwright node folders manually
        mkdir -p "node-red-contrib-puppeteer" "node-red-contrib-playwright"
        echo '{"name":"node-red-contrib-puppeteer","node-red":{"nodes":{}},"version":"1.0.0"}' > node-red-contrib-puppeteer/package.json
        echo '{"name":"node-red-contrib-playwright","node-red":{"nodes":{}},"version":"1.0.0"}' > node-red-contrib-playwright/package.json
        rsync -a node_modules/puppeteer/ node-red-contrib-puppeteer/
        rsync -a node_modules/playwright/ node-red-contrib-playwright/

    - name: Zip All ✅
      run: |
        cd nodes/node_modules
        for node in node-red-dashboard node-red-node-ui-webcam node-red-contrib-puppeteer node-red-contrib-playwright; do
          if [ -d "../$node" ]; then
            echo "📦 Creating $node.zip"
            cd ..
            zip -r "$node.zip" "$node" -x "*/node_modules/*" "*/test*" "*/tests*" >/dev/null 2>&1
            echo "✅ $(du -h "$node.zip" | cut -f1)"
          else
            echo "❌ $node missing"
          fi
        done
        
    - name: Commit
      run: |
        git config --local user.name "GitHub Action"
        git config --local user.email "action@github.com"
        ls -la *.zip
        git add *.zip
        git commit -m "4x Node-RED nodes ✅ $(date)" || echo "No zips"
        git push
