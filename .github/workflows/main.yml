name: Node-RED Nodes ✅ PERFECT

on: 
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install REAL Nodes
      run: |
        mkdir -p nodes
        cd nodes
        npm init -y -s
        
        # ✅ Working Node-RED nodes
        npm install node-red-dashboard@3.6.6
        npm install node-red-node-email
        npm install node-red-contrib-web-worldmap

        # ✅ Browser automation
        npm install puppeteer playwright --save-optional

    - name: Create Zips in ROOT ✅
      run: |
        cd nodes
        
        # Move any existing zips
        mv ../*.zip . 2>/dev/null || true
        
        # 1. Dashboard ✅
        if [ -d "node_modules/node-red-dashboard" ]; then
          rsync -a node_modules/node-red-dashboard/ dashboard/
          zip -r ../dashboard.zip dashboard -x "*/node_modules/*" >/dev/null 2>&1
          echo "✅ dashboard.zip $(du -h ../dashboard.zip | cut -f1)"
          rm -rf dashboard
        fi
        
        # 2. Email ✅
        if [ -d "node_modules/node-red-node-email" ]; then
          rsync -a node_modules/node-red-node-email/ email/
          zip -r ../email.zip email -x "*/node_modules/*" >/dev/null 2>&1
          echo "✅ email.zip $(du -h ../email.zip | cut -f1)"
          rm -rf email
        fi
        
        # 3. Worldmap ✅
        if [ -d "node_modules/node-red-contrib-web-worldmap" ]; then
          rsync -a node_modules/node-red-contrib-web-worldmap/ worldmap/
          zip -r ../worldmap.zip worldmap -x "*/node_modules/*" >/dev/null 2>&1
          echo "✅ worldmap.zip $(du -h ../worldmap.zip | cut -f1)"
          rm -rf worldmap
        fi
        
        # 4. Browser Tools (Puppeteer + Playwright) ✅
        mkdir -p ../browser-tools
        [ -d "node_modules/puppeteer" ] && rsync -a node_modules/puppeteer/ ../browser-tools/ || true
        [ -d "node_modules/playwright" ] && rsync -a node_modules/playwright/ ../browser-tools/ || true
        echo '{"name":"browser-tools","version":"1.0.0"}' > ../browser-tools/package.json
        cd ..
        zip -r browser-tools.zip browser-tools -x "*/node_modules/*" >/dev/null 2>&1
        echo "✅ browser-tools.zip $(du -h browser-tools.zip | cut -f1)"
        rm -rf browser-tools nodes

    - name: Commit & Push
      run: |
        echo "📁 Files in root:"
        ls -la *.zip
        echo "📊 Sizes:"
        du -h *.zip | sort -hr
        
        git config --local user.name "GitHub Action"
        git config --local user.email "action@github.com"
        git add *.zip
        git commit -m "✅ $(ls *.zip | wc -l)x Node-RED zips $(date)" || echo "No new files"
        git push
