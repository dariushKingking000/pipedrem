name: Install Node-RED Nodes and Zip

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Create Node-RED directory
      run: |
        mkdir -p node-red-data/nodes
        cd node-red-data
        
    - name: Install node-red-dashboard
      run: |
        npm init -y
        npm install node-red-dashboard --save
        zip -r node-red-dashboard.zip node_modules/node-red-dashboard package.json
        mv node-red-dashboard.zip ../nodes/
        
    - name: Install node-red-node-ui-webcam
      run: |
        cd node-red-data
        npm install node-red-node-ui-webcam --save
        zip -r node-red-node-ui-webcam.zip node_modules/node-red-node-ui-webcam
        mv node-red-node-ui-webcam.zip ../nodes/
        
    - name: Install node-red-contrib-puppeteer
      run: |
        cd node-red-data
        npm install node-red-contrib-puppeteer --save
        zip -r node-red-contrib-puppeteer.zip node_modules/node-red-contrib-puppeteer
        mv node-red-contrib-puppeteer.zip ../nodes/
        
    - name: Install node-red-contrib-playwright
      run: |
        cd node-red-data
        npm install node-red-contrib-playwright --save
        zip -r node-red-contrib-playwright.zip node_modules/node-red-contrib-playwright
        mv node-red-contrib-playwright.zip ../nodes/
        
    - name: Install node-red-node-email (optional)
      run: |
        cd node-red-data
        npm install node-red-node-email --save
        zip -r node-red-node-email.zip node_modules/node-red-node-email
        mv node-red-node-email.zip ../nodes/
        
    - name: Upload zipped nodes as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: node-red-nodes
        path: nodes/
        
    - name: Commit zipped files to repo
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add nodes/
        git commit -m "Add Node-RED nodes zip files" || echo "No changes"
        git push
