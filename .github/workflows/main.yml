name: Install Node-RED Nodes and Zip

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Create directories
      run: mkdir -p temp-nodes nodes
      
    - name: Install all nodes
      run: |
        cd temp-nodes
        npm init -y
        npm install \
          node-red-dashboard \
          node-red-node-ui-webcam \
          node-red-contrib-puppeteer \
          node-red-contrib-playwright \
          node-red-node-email \
          --save --omit=dev --verbose
        
    - name: Create individual zips
      run: |
        cd temp-nodes
        for node in node-red-dashboard node-red-node-ui-webcam node-red-contrib-puppeteer node-red-contrib-playwright node-red-node-email; do
          if [ -d "node_modules/$node" ]; then
            zip -r "../nodes/${node}.zip" "node_modules/$node" package.json package-lock.json -x "node_modules/*/*" -i "node_modules/$node/*"
            echo "✅ $node zipped"
          fi
        done
        cd ..
        
    - name: Commit to repo
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add nodes/
        git commit -m "Add Node-RED nodes zips" || echo "No new files"
        git push
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: node-red-nodes
        path: nodes/
