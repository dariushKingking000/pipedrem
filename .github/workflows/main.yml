name: Screenshot Bot
on: 
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create .gitignore
      run: |
        cat > .gitignore << EOF
        node_modules/
        bot.js
        package.json
        package-lock.json
        command.txt
        last_command.txt
        command_pipe.txt
        response.txt
        frames/
        /tmp/
        chrome-user-data-*
        EOF
    
    - name: Install Chrome + FFmpeg (FIXED)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq wget gnupg xvfb x11-xkb-utils ffmpeg bc \
          libnss3 libatk1.0-0 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
          libatspi2.0-0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
          libpango-1.0-0 libcairo2 libgtk-3-0 libgdk-pixbuf2.0-0
        
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | \
          sudo gpg --dearmor --yes -o /usr/share/keyrings/google-chrome.gpg
        
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | \
          sudo tee /etc/apt/sources.list.d/google-chrome.list
        
        sudo apt-get update -qq
        sudo apt-get install -y -qq google-chrome-stable
        
        echo "✅ Chrome: $(google-chrome --version)"
    
    - name: Install Node deps
      run: npm init -y && npm i puppeteer@latest
    
    - name: Setup Bot (STEALTH + PIPEDREAM)
      run: |
        cat > bot.js << 'EOF'
        const puppeteer = require("puppeteer");
        const fs = require("fs");
        const { execSync } = require("child_process");
        
        let browser = null;
        let page = null;
        
        function wait(ms) {
          return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        async function initBrowser() {
          console.log("🚀 راه‌اندازی...");
          browser = await puppeteer.launch({
            headless: false,
            executablePath: '/usr/bin/google-chrome-stable',
            args: [
              '--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage',
              '--no-first-run','--no-service-autorun','--no-zygote','--single-process',
              '--password-store=basic','--window-size=1920,1080',
              '--disable-web-security','--disable-features=VizDisplayCompositor',
              '--disable-gpu','--disable-extensions'
            ]
          });
          
          page = await browser.newPage();
          await page.setViewport({ width: 1920, height: 1080 });
          
          // STEALTH MODE
          await page.evaluateOnNewDocument(() => {
            Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
            Object.defineProperty(navigator, 'plugins', { get: () => [1, 2, 3, 4, 5] });
            Object.defineProperty(navigator, 'languages', { get: () => ['fa-IR', 'fa', 'en-US', 'en'] });
            window.chrome = { runtime: {} };
            const originalQuery = window.navigator.permissions.query;
            window.navigator.permissions.query = (parameters) => (
              parameters.name === 'notifications' ?
                Promise.resolve({ state: Notification.permission }) :
                originalQuery(parameters)
            );
          });
          
          // PIPEDREAM PAGE + HUMAN MOVEMENT
          await page.goto("https://pipedream.com/auth/signup", { 
            waitUntil: 'networkidle0', 
            timeout: 60000 
          });
          await wait(10000);
          await page.mouse.move(100, 100);
          console.log("✅ آماده Pipedream!");
        }
        
        async function reconnectPage() {
          try {
            await page.bringToFront();
            await page.evaluate(() => true);
            return true;
          } catch(e) {
            console.log("🔄 Reconnect...");
            if (page) await page.close().catch(() => {});
            if (browser) await browser.close().catch(() => {});
            await initBrowser();
            return true;
          }
        }
        
        async function takeScreenshot() {
          console.log("📸 Screenshot...");
          await reconnectPage();
          await wait(1000);
          await page.screenshot({ path: 'screenshot.png', type: 'png' });
          await page.screenshot({ path: 'screenshot-full.png', fullPage: true, type: 'png' });
          const buffer = await page.screenshot({ type: 'png' });
          fs.writeFileSync("screenshot-base64.txt", buffer.toString('base64'));
        }
        
        async function executeCommand(cmd) {
          console.log(`🔧 ${cmd}`);
          await reconnectPage();
          
          if (cmd.startsWith("click ")) {
            const [x, y] = cmd.slice(6).trim().split(",").map(Number);
            await page.mouse.move(x + Math.random()*10-5, y + Math.random()*10-5);
            await wait(100);
            await page.mouse.click(x, y, { delay: 50 });
          } else if (cmd.startsWith("type ")) {
            const text = cmd.slice(5).trim();
            await page.keyboard.type(text, { delay: 80 });
          } else if (cmd === "enter") {
            await page.keyboard.press('Enter', { delay: 50 });
          } else if (cmd.startsWith("goto ")) {
            await page.goto(cmd.slice(5).trim(), { waitUntil: 'networkidle0', timeout: 60000 });
          }
        }
        
        async function recordVideo(commands) {
          console.log("🎥 Video...");
          
          if (fs.existsSync('frames')) fs.rmSync('frames', { recursive: true });
          fs.mkdirSync('frames');
          
          let frame = 0;
          for(let cmd of commands) {
            // Pre frames
            for(let i = 0; i < 3; i++) {
              await reconnectPage();
              await page.screenshot({ path: `frames/f${frame.toString().padStart(5,'0')}.png` });
              frame++;
              await wait(500);
            }
            
            await executeCommand(cmd);
            
            // Post frames
            for(let i = 0; i < 7; i++) {
              await reconnectPage();
              await page.screenshot({ path: `frames/f${frame.toString().padStart(5,'0')}.png` });
              frame++;
              await wait(500);
            }
          }
          
          await takeScreenshot();
          
          const video = `video_${Date.now()}.mp4`;
          execSync(`ffmpeg -y -r 12 -i frames/f%05d.png -c:v libx264 -crf 23 -pix_fmt yuv420p ${video}`);
          console.log(`✅ Video: ${fs.statSync(video).size/1024/1024}MB`);
          
          fs.rmSync('frames', { recursive: true });
        }
        
        (async () => {
          await initBrowser();
          while(true) {
            if (fs.existsSync('command_pipe.txt')) {
              let cmd = fs.readFileSync('command_pipe.txt', 'utf8').trim();
              console.log(`🆕 ${cmd}`);
              
              if (cmd === "exit") process.exit(0);
              
              let commands = cmd.split('\n').map(l=>l.trim()).filter(l=>l);
              await recordVideo(commands);
              fs.writeFileSync('response.txt', `✅ ${commands.length} OK`);
              fs.unlinkSync('command_pipe.txt');
            }
            await wait(500);
          }
        })();
        EOF
    
    - name: Bot LOOP
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
        
        git config --global user.name "Screenshot Bot"
        git config --global user.email "bot@github.com"
        
        rm -rf *txt *png *mp4 frames/ 2>/dev/null || true
        
        timeout 7200 node bot.js &
        PID=$!
        echo "🤖 $PID"
        sleep 45
        
        while true; do
          git fetch origin
          git reset --hard origin/main
          
          if [ -f command.txt ]; then
            CONTENT=$(cat command.txt)
            LAST=$(cat last_command.txt 2>/dev/null || echo "")
            
            if [ "$CONTENT" != "$LAST" ] && [ "$CONTENT" != "exit" ]; then
              echo "🆕 $CONTENT"
              rm -rf *png *mp4 *txt frames/ 2>/dev/null || true
              echo "$CONTENT" > command_pipe.txt
              
              for i in {1..180}; do
                if [ -f response.txt ]; then
                  cat response.txt
                  rm -f response.txt command_pipe.txt
                  break
                fi
                sleep 2
              done
              
              FILES=""
              for f in screenshot.png screenshot-full.png screenshot-base64.txt video_*.mp4; do
                [ -f "$f" ] && FILES="$FILES $f"
              done
              
              if [ -n "$FILES" ]; then
                git add -f $FILES .gitignore bot.js
                if ! git diff --staged --quiet; then
                  git commit -m "🎥 Pipedream Bot | $(date +'%H:%M') | $CONTENT"
                  git push origin main -f
                  echo "✅ PUSH OK!"
                fi
              fi
              
              echo "$CONTENT" > last_command.txt
            fi
            rm -f command.txt
          fi
          
          sleep 10
        done
