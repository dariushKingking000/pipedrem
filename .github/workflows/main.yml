name: Install Node-RED Nodes ✅

on: 
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write  # 👈 این خط مهمه!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install all nodes
      run: |
        mkdir -p temp-nodes nodes
        cd temp-nodes
        npm init -y
        npm install \
          node-red-dashboard \
          node-red-node-ui-webcam \
          node-red-contrib-puppeteer \
          node-red-contrib-playwright \
          node-red-node-email \
          --save --omit=dev
        
    - name: Create zips
      run: |
        cd temp-nodes/node_modules
        echo "📁 Available nodes:"
        ls -la | grep "node-red"
        
        for node in node-red-dashboard node-red-node-ui-webcam node-red-contrib-puppeteer node-red-contrib-playwright node-red-node-email; do
          if [ -d "$node" ]; then
            echo "📦 Zipping $node..."
            (cd "$node" && zip -r "../../../nodes/${node}.zip" . -x "node_modules/*" "*.git*" "test*" "tests*" "coverage*")
            echo "✅ $node: $(du -h ../../../nodes/${node}.zip | cut -f1)"
          else
            echo "❌ $node missing"
          fi
        done
        
    - name: Commit & Push
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add nodes/
        git commit -m "Add Node-RED nodes (zipped) ✅" || echo "No changes"
        git push
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: node-red-nodes
        path: nodes/
