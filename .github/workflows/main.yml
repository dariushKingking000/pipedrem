name: Node-RED Nodes ✅ FINAL

on: 
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Create & Install
      run: |
        mkdir -p temp-nodes nodes
        cd temp-nodes
        npm init -y -s
        npm ci --omit=dev --no-audit --no-fund || npm install \
          node-red-dashboard \
          node-red-node-ui-webcam \
          node-red-contrib-puppeteer \
          node-red-contrib-playwright \
          node-red-node-email \
          --save --omit=dev --no-audit --no-fund
        
    - name: Zip
      run: |
        cd temp-nodes/node_modules
        for node in node-red-dashboard node-red-node-ui-webcam node-red-contrib-puppeteer node-red-contrib-playwright node-red-node-email; do
          [ -d "$node" ] && {
            echo "📦 $node"
            (cd "$node" && zip -r "../../nodes/${node}.zip" . -x "node_modules/*" "*.git*" "test*" "tests*" "coverage*" ".*")
            du -h "../../nodes/${node}.zip"
          }
        done
        
    - name: Commit
      run: |
        git config --local user.name "GitHub Action"
        git config --local user.email "action@github.com"
        git add nodes/
        git diff --staged --quiet || git commit -m "Node-RED nodes added ✅" && git push
        
    - uses: actions/upload-artifact@v4
      with:
        name: Node-RED-Nodes
        path: nodes/
