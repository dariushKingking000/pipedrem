name: Node-RED Nodes ✅ WORKING

on: 
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install REAL Nodes
      run: |
        mkdir -p nodes
        cd nodes
        npm init -y -s
        
        # ✅ اینا کار می‌کنن
        npm install node-red-dashboard@3.6.6
        npm install node-red-node-email
        npm install node-red-contrib-web-worldmap
        
        # Browser tools (manual)
        npm install puppeteer playwright --save-optional

    - name: Create Custom Zips
      run: |
        cd nodes
        
        # Dashboard ✅
        if [ -d "node_modules/node-red-dashboard" ]; then
          rsync -a node_modules/node-red-dashboard/ dashboard/
          zip -r dashboard.zip dashboard -x "*/node_modules/*" >/dev/null
          echo "✅ dashboard.zip $(du -h dashboard.zip | cut -f1)"
          rm -rf dashboard
        fi
        
        # Email ✅
        if [ -d "node_modules/node-red-node-email" ]; then
          rsync -a node_modules/node-red-node-email/ email/
          zip -r email.zip email -x "*/node_modules/*" >/dev/null
          echo "✅ email.zip $(du -h email.zip | cut -f1)"
          rm -rf email
        fi
        
        # Puppeteer/Playwright bundle
        mkdir -p browser-tools
        cp -r node_modules/puppeteer browser-tools/
        cp -r node_modules/playwright browser-tools/
        echo '{"name":"browser-tools","version":"1.0.0"}' > browser-tools/package.json
        zip -r browser-tools.zip browser-tools -x "*/node_modules/*" >/dev/null
        echo "✅ browser-tools.zip $(du -h browser-tools.zip | cut -f1)"
        rm -rf browser-tools

    - name: Commit
      run: |
        ls -la *.zip
        git config --local user.name "GitHub Action"
        git config --local user.email "action@github.com"
        git add *.zip
        git commit -m "✅ 3x Node-RED + Browser Tools $(date)" || echo "No files"
        git push
