name: Install Node-RED Nodes ✅ FIXED

on: 
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js (NO CACHE)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: false  # 👈 حل مشکل cache
        
    - name: Install nodes
      working-directory: ./temp-nodes
      run: |
        mkdir -p ../nodes
        npm init -y
        npm install \
          node-red-dashboard \
          node-red-node-ui-webcam \
          node-red-contrib-puppeteer \
          node-red-contrib-playwright \
          node-red-node-email \
          --save --omit=dev --no-fund --no-audit
        
    - name: Zip nodes
      run: |
        mkdir -p nodes
        cd temp-nodes/node_modules
        
        for node in node-red-dashboard node-red-node-ui-webcam node-red-contrib-puppeteer node-red-contrib-playwright node-red-node-email; do
          if [ -d "$node" ]; then
            echo "📦 $node..."
            (cd "$node" && zip -r "../../nodes/${node}.zip" . -x "node_modules/*" "*.git*" "test*" "tests*" "coverage*" ".*")
            ls -lh "../../nodes/${node}.zip"
          fi
        done
        
    - name: Commit
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add nodes/
        if git diff --staged --quiet; then
          echo "No new files"
        else
          git commit -m "Add Node-RED nodes ✅"
          git push
        fi
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: nodes
        path: nodes/
