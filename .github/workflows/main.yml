name: Flask API Status Check

on:
  schedule:
    # هر 15 دقیقه یک بار اجرا شود (برای شبیه‌سازی چک کردن منظم)
    - cron: '*/15 * * * *'
  workflow_dispatch: # امکان اجرای دستی از طریق دکمه در تب Actions

jobs:
  check_api_status:
    runs-on: ubuntu-latest # سیستم عامل که workflow روی آن اجرا می‌شود

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # چک کردن کد پروژه شما

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x' # از آخرین نسخه پایتون استفاده کند

      - name: Install dependencies
        run: |
          # اطمینان از نصب کتابخانه requests
          pip install requests
          # اگر Flask هم نیاز به نصب داشت (که در این سناریو Flask باید از قبل روی سرور باشه)
          # pip install Flask

      - name: Run Flask API (Simulated)
        # این قسمت نیاز به تنظیمات شبکه یا اجرای Flask در یک محیط مجزا دارد
        # برای سادگی، فرض می‌کنیم Flask از قبل در حال اجراست یا با ابزاری مثل 'serve' بالا میاد
        # در یک سناریوی واقعی، این بخش پیچیده‌تر خواهد بود
        # مثلاً ممکن است نیاز باشد Flask را در یک سرویس یا داکر بالا بیاورید
        # برای این مثال، فرض می‌کنیم Flask از قبل اجرا شده و در دسترس است.
        # اگر Flask در همین ریپو باشد، می‌توان آن را هم اجرا کرد:
        # run: python app.py & # اجرای Flask در پس‌زمینه

      - name: Check Flask API Status
        run: |
          # اینجا همان کد پایتونی که به من دادید، اجرا می‌شود
          # اما به جای اجرای مستقیم، آن را در یک فایل موقت ذخیره و اجرا می‌کنیم
          echo '''import requests

api_url = "http://127.0.0.1:5000/status" # توجه: این آدرس در محیط GitHub Actions متفاوت خواهد بود

try:
    response = requests.get(api_url)
    response.raise_for_status()

    print("GitHub Actions Simulation:")
    print(f"API Status Check: SUCCESS")
    print(f"Response from API: {response.json()}")

except requests.exceptions.ConnectionError:
    print("GitHub Actions Simulation:")
    print(f"API Status Check: FAILED")
    print(f"Error: Could not connect to {api_url}. Is the Flask app running on the correct host/port?")

except requests.exceptions.HTTPError as e:
    print("GitHub Actions Simulation:")
    print(f"API Status Check: FAILED")
    print(f"HTTP Error: {e}")

except Exception as e:
    print("GitHub Actions Simulation:")
    print(f"API Status Check: FAILED")
    print(f"An unexpected error occurred: {e}")
''' > check_api.py
          python check_api.py
