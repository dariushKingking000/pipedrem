name: Screenshot Bot
on: 
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create .gitignore FIRST
      run: |
        cat > .gitignore << EOF
        node_modules/
        bot.js
        package.json
        package-lock.json
        command.txt
        last_command.txt
        command_pipe.txt
        response.txt
        frames/
        /tmp/
        chrome-user-data-*
        EOF
    
    - name: Install Chrome + FFmpeg (FINAL FIX)
      run: |
        sudo apt-get update -qq
        
        # Essential deps (بدون libasound2)
        sudo apt-get install -y -qq \
          wget gnupg xvfb x11-xkb-utils ffmpeg bc \
          libxss1 libnss3 libatk-bridge2.0-0 libdrm2 \
          libxkbcommon0 libatspi2.0-0 libxcomposite1 \
          libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 \
          libcairo-gobject2 libgtk-3-0 libgconf-2-4
        
        # Chrome GPG (batch)
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | \
          sudo gpg --dearmor --yes -o /usr/share/keyrings/google-chrome.gpg
        
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | \
          sudo tee /etc/apt/sources.list.d/google-chrome.list
        
        sudo apt-get update -qq
        sudo apt-get install -y -qq google-chrome-stable
        
        # Verify
        google-chrome --version
        ffmpeg -version
        
        echo "✅ ALL INSTALLED!"
    
    - name: Install Node deps
      run: npm init -y && npm i puppeteer@latest
    
    - name: Setup Bot
      run: |
        cat > bot.js << 'EOF'
        const puppeteer = require("puppeteer");
        const fs = require("fs");
        const { execSync } = require("child_process");
        
        let browser = null;
        let page = null;
        
        function wait(ms) {
          return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        async function initBrowser() {
          console.log("🚀 Browser...");
          
          browser = await puppeteer.launch({
            headless: false,
            executablePath: '/usr/bin/google-chrome-stable',
            args: [
              '--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage',
              '--no-first-run','--no-zygote','--single-process',
              '--disable-background-timer-throttling','--disable-extensions',
              '--disable-gpu','--window-size=1920,1080',
              '--disable-web-security'
            ]
          });
          
          page = await browser.newPage();
          await page.setViewport({ width: 1920, height: 1080 });
          await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');
          
          await page.goto("https://www.google.com", { 
            waitUntil: 'domcontentloaded', 
            timeout: 60000 
          });
          
          await wait(2000);
          console.log("✅ Ready!");
        }
        
        async function reconnect() {
          try {
            await page.bringToFront();
            await page.evaluate(() => true);
            return true;
          } catch(e) {
            console.log("🔄 Reconnect...");
            if (page) await page.close().catch(() => {});
            if (browser) await browser.close().catch(() => {});
            await initBrowser();
            return true;
          }
        }
        
        async function screenshot() {
          console.log("📸 Screenshot...");
          await reconnect();
          await wait(1000);
          
          await page.screenshot({ path: 'screenshot.png' });
          await page.screenshot({ path: 'screenshot-full.png', fullPage: true });
          
          const buffer = await page.screenshot({ type: 'png', fullPage: true });
          fs.writeFileSync('screenshot-base64.txt', buffer.toString('base64'));
        }
        
        async function execute(cmd) {
          console.log(`🔧 ${cmd}`);
          await reconnect();
          
          if (cmd.startsWith("goto ")) {
            await page.goto(cmd.slice(5).trim(), { waitUntil: 'domcontentloaded', timeout: 60000 });
          } else if (cmd.startsWith("click ")) {
            const [x, y] = cmd.slice(6).trim().split(",").map(Number);
            await page.mouse.click(x, y);
          } else if (cmd.startsWith("type ")) {
            await page.keyboard.type(cmd.slice(5).trim());
          } else if (cmd === "enter") {
            await page.keyboard.press('Enter');
          } else if (cmd === "copy") {
            const text = await page.evaluate(() => document.body.innerText.slice(0, 50000));
            fs.writeFileSync('page-text.txt', text);
          }
        }
        
        async function video(commands) {
          console.log("🎥 Video...");
          
          if (fs.existsSync('frames')) fs.rmSync('frames', { recursive: true });
          fs.mkdirSync('frames');
          
          let frame = 0;
          for(let cmd of commands) {
            // 2 pre frames
            for(let i = 0; i < 2; i++) {
              await reconnect();
              await page.screenshot({ path: `frames/f${frame.toString().padStart(5,'0')}.png` });
              frame++;
              await wait(500);
            }
            
            await execute(cmd);
            
            // 4 post frames
            for(let i = 0; i < 4; i++) {
              await reconnect();
              await page.screenshot({ path: `frames/f${frame.toString().padStart(5,'0')}.png` });
              frame++;
              await wait(500);
            }
          }
          
          await screenshot();
          
          const videoFile = `video_${Date.now()}.mp4`;
          execSync(`ffmpeg -y -r 8 -i frames/f%05d.png -c:v libx264 -crf 25 -pix_fmt yuv420p -vf "scale=1280:720" ${videoFile}`);
          
          fs.rmSync('frames', { recursive: true });
          console.log(`✅ Video OK!`);
        }
        
        (async () => {
          await initBrowser();
          
          while(true) {
            if (fs.existsSync('command_pipe.txt')) {
              let cmd = fs.readFileSync('command_pipe.txt', 'utf8').trim();
              console.log(`🆕 ${cmd}`);
              
              if (cmd === "exit") process.exit(0);
              
              let commands = cmd.split('\n').map(l=>l.trim()).filter(l=>l);
              await video(commands);
              fs.writeFileSync('response.txt', `✅ ${commands.length} OK`);
              fs.unlinkSync('command_pipe.txt');
            }
            await wait(1000);
          }
        })();
        EOF
    
    - name: Bot LOOP
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1920x1080x24 -ac &
        
        git config --global user.name "Screenshot Bot"
        git config --global user.email "bot@github.com"
        
        rm -rf *txt *png *mp4 frames/ 2>/dev/null || true
        
        timeout 7200 node bot.js &
        PID=$!
        echo "🤖 $PID"
        sleep 45
        
        while true; do
          git fetch origin
          git reset --hard origin/main
          
          if [ -f command.txt ]; then
            CONTENT=$(cat command.txt)
            LAST=$(cat last_command.txt 2>/dev/null || echo "")
            
            if [ "$CONTENT" != "$LAST" ] && [ "$CONTENT" != "exit" ]; then
              echo "🆕 $CONTENT"
              rm -rf *png *mp4 *txt frames/ 2>/dev/null || true
              echo "$CONTENT" > command_pipe.txt
              
              for i in {1..120}; do
                [ -f response.txt ] && {
                  cat response.txt
                  rm -f response.txt command_pipe.txt
                  break
                }
                sleep 2
              done
              
              FILES=""
              for f in screenshot.png screenshot-full.png screenshot-base64.txt video_*.mp4 page-text.txt; do
                [ -f "$f" ] && FILES="$FILES $f"
              done
              
              [ -n "$FILES" ] && {
                git add -f $FILES .gitignore bot.js
                if ! git diff --staged --quiet; then
                  git commit -m "🎥 $(date +'%H:%M') | $CONTENT"
                  git push origin main -f
                fi
              }
              
              echo "$CONTENT" > last_command.txt
            fi
            rm -f command.txt
          fi
          
          sleep 10
        done
